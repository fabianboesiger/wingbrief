# Räumliche Einheiten von wingbrief.
#
# SHV definiert keine Regionen. Fronten, überregionaler Wind und Wärmegewitter
# werden pro Region geprüft, Regiowind und Föhn pro Tal (SHV: «Tal beginnt an
# einem Pass am Alpenhauptkamm», Karte «Alpines Pumpen»).
#
# Koordinaten: WGS84 [lat, lon]. Stationen: SwissMetNet-Kürzel (MeteoSchweiz).

pressure_stations:
  west: GVE        # Genève-Cointrin   (West-Ost-Druck, SHV)
  east: KLO        # Zürich-Kloten     (West-Ost-Druck, SHV)
  south: LUG       # Lugano            (Nord-Süd-Druck)
  north: SMA       # Zürich-Fluntern   (Nord-Süd-Druck)

# Passübergänge am Alpenhauptkamm (bzw. Grimsel für das Haslital).
# north/south: Punkte ca. 15–25 km beidseits für den Temperaturvergleich auf
# Passhöhe (ca. 2000 m ü. M., SHV). normal_from_south: Windrichtung (woher, °),
# die senkrecht von Süden über den Kamm weht (Südföhn); +180° = Nordföhn.
passes:
  gsb:
    name: Grosser St. Bernhard
    crest: [45.869, 7.171]
    north: [46.020, 7.200]
    south: [45.760, 7.300]
    normal_from_south: 160
  simplon:
    name: Simplon
    crest: [46.250, 8.031]
    north: [46.330, 8.010]
    south: [46.160, 8.150]
    normal_from_south: 170
  gotthard:
    name: Gotthard
    crest: [46.559, 8.561]
    north: [46.720, 8.600]
    south: [46.450, 8.700]
    normal_from_south: 180
  lukmanier:
    name: Lukmanier
    crest: [46.563, 8.801]
    north: [46.680, 8.850]
    south: [46.470, 8.930]
    normal_from_south: 180
  sanbernardino:
    name: San Bernardino
    crest: [46.495, 9.170]
    north: [46.590, 9.300]
    south: [46.360, 9.200]
    normal_from_south: 180
  maloja:
    name: Maloja
    crest: [46.401, 9.694]
    north: [46.480, 9.800]
    south: [46.330, 9.560]
    normal_from_south: 210
  grimsel:
    name: Grimsel
    crest: [46.561, 8.333]
    north: [46.680, 8.280]
    south: [46.450, 8.250]
    normal_from_south: 180

# Regionen für die Übersicht. points: Tal, Voralpen/Mittelland, Kamm.
# stations: für die statistisch verbesserte Lokalprognose (SHV, überregionaler Wind).
# channels: Geländeformen, die überregionalen Wind kanalisieren (SHV).
