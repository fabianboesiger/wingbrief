# Täler für Regiowind und Föhn.
# axis: Punkte von der Talmündung zum Talende.
# side: nord (Lee bei Südföhn), sued (Lee bei Nordföhn), inneralpin (beides möglich).
# pass: Passübergang für den Temperaturvergleich; pass_valley: Tal beginnt an
# einem Pass am Alpenhauptkamm (SHV, Föhn fortgeschritten).
# crest_m: typische Kretenhöhe (SHV, Regiowind: Inversion unter Kretenhöhe).
# station: Referenzstation für Lokalprognose und Klimatologie.
# pumping: Hinweise aus der SHV-Karte «Alpines Pumpen».
valleys:
