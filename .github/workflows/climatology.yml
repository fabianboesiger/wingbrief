name: Klimatologie

on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 2 1 *"      # jährlich am 2. Januar

permissions:
  contents: write

jobs:
  climatology:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: python -m wingbrief.main climatology
      - name: Commit
        run: |
          git config user.name "wingbrief-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/climatology.json
          git diff --cached --quiet || (git commit -m "Klimatologie aktualisiert" && git push)
