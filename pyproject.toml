[project]
name = "wingbrief"
version = "0.1.0"
description = "Prognose-Check nach der SHV-Meteo-Entscheidungsstrategie (Planung)"
requires-python = ">=3.11"
dependencies = [
  "eccodes>=2.38",
  "numpy>=1.26",
  "pyyaml>=6",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["wingbrief", "wingbrief.checks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
